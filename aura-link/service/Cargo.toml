[package]
name = "aura-service"
version = "0.1.0"
edition = "2021"
description = "The Aura PC service: owns Aura Link (RFCOMM 7c1e0040 + LAN fast path), hosts the unlock helper's pipe for the sign-in tile (same code as continuity-helper), routes lock events. Library for the item-14 tray app + aura.exe."

[lib]
name = "aura_service"
path = "src/lib.rs"

[[bin]]
name = "aura"
path = "src/main.rs"

[dependencies]
aura-link = { path = "../rust" }
unlock-pc = { path = "../../unlock-stage1/pc" }
continuity-helper = { path = "../../unlock-stage2/helper" }
watch-hint = { path = "../../unlock-watch/pc-patch/watch-hint" }
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "std", "alloc"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Foundation",
  "Devices_Bluetooth",
  "Devices_Bluetooth_Rfcomm",
  "Networking",
  "Networking_Sockets",
  "Storage_Streams",
  "Media_Control",
  "Foundation_Collections",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Shutdown",
  "Win32_System_RemoteDesktop",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }

[profile.release]
opt-level = 2
