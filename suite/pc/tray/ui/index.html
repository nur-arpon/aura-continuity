<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Continuity</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="status">Status</button>
    <button role="tab" data-tab="clipboard">Clipboard</button>
    <button role="tab" data-tab="seen">Last seen</button>
  </nav>

  <section id="status" class="panel">
    <div class="state" id="state"><span class="dot"></span><span id="state-label">Checking...</span></div>
    <p class="sub" id="phone-line"></p>
    <ul class="links" id="links"></ul>
    <h2>What to fix</h2>
    <ul class="findings" id="findings"></ul>
    <p class="sub">Snip to phone: <b id="hotkey"></b>. Data: <a href="#" id="data-dir"></a></p>
  </section>

  <section id="clipboard" class="panel" hidden>
    <input id="q" type="search" placeholder="Search  (from:phone  is:pinned  is:image)" autocomplete="off">
    <ul class="clips" id="clips"></ul>
  </section>

  <section id="seen" class="panel" hidden>
    <p class="big" id="seen-line"></p>
    <ul class="events" id="events"></ul>
  </section>
  <script src="app.js"></script>
</body>
</html>
