[package]
name = "continuity-core"
version = "0.1.0"
edition = "2021"
description = "Continuity suite: platform-independent glue logic (link state, diagnostics, watchers, history). No I/O to devices."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
