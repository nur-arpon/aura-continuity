name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [aura-link/rust, aura-link/service, unlock-stage1/pc, unlock-stage2/helper, aura-pc/src-tauri]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "${{ matrix.crate }}" }
      - name: Fetch scrcpy (bundled resource)
        if: matrix.crate == 'aura-pc/src-tauri'
        run: ./tools/fetch-scrcpy.ps1
        shell: pwsh
      - run: cargo test
        working-directory: ${{ matrix.crate }}
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get && flutter test
        working-directory: unlock-stage1/phone
      - run: ./gradlew testDebugUnitTest
        working-directory: unlock-stage1/phone/android
