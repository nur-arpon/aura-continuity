<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aura</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* Chat-head tree (laptop): an Aura head on the screen edge fanning out into the phone's recent apps, then a
     phone browser into its recent pages. The window is small (just the head) or the whole screen while open or dragged. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: var(--type-caption); user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; }
  #stage.open { background: radial-gradient(ellipse at var(--hx, 100%) var(--hy, 50%), rgba(7,15,28,.32), rgba(7,15,28,.0) 62%); }
  .head, .b { position: absolute; border-radius: 50%; will-change: transform, opacity; touch-action: none; }
  .head { width: 56px; height: 56px; cursor: grab; z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.45), 0 0 0 2px rgba(120,170,255,.55); background: #0c1a33; overflow: hidden; }
  .head img { width: 100%; height: 100%; display: block; pointer-events: none; }
  .head.drag { cursor: grabbing; }
  .b { width: 52px; height: 52px; background: #fff; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.4); z-index: 3; display: grid; place-items: center; overflow: visible; }
  .b > .ico { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; pointer-events: none; }
  .b > .ltr { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font: 600 22px/1 var(--font-display); color: #fff; pointer-events: none; }
  .b .lab { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); max-width: 120px; padding: 2px 8px; border-radius: 999px;
    background: rgba(13,27,51,.92); color: #eaf1ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; font: 500 11px/16px var(--font-text); }
  .b.page { background: #12254a; }
  .b.page .lab { max-width: 150px; }
  .b .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #e5352b; color: #fff;
    font: 700 11px/18px var(--font-text); text-align: center; box-shadow: 0 0 0 2px #fff; pointer-events: none; }
  .b:hover { filter: brightness(1.08); }
  #x { position: absolute; width: 64px; height: 64px; border-radius: 50%; display: none; place-items: center; z-index: 2; opacity: 0;
    background: rgba(13,27,51,.9); border: 2px solid rgba(255,255,255,.35); color: #fff; font: 600 26px/1 var(--font-text); }
  #x.hot { background: #c42b1c; border-color: #fff; }
  .head.playing { box-shadow: 0 6px 18px rgba(0,0,0,.45), 0 0 0 3px rgba(80,220,140,.9); }
  #np { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); width: 300px; display: none; align-items: center; gap: 10px; padding: 8px 10px; z-index: 4;
    border-radius: 16px; background: rgba(13,27,51,.94); color: #eaf1ff; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  #np .art { width: 44px; height: 44px; border-radius: 10px; background: #1b3159 center/cover; flex: none; }
  #np .txt { flex: 1; min-width: 0; pointer-events: none; }
  #np .t { font: 600 13px/18px var(--font-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np .a { font: 400 11px/15px var(--font-text); opacity: .72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np button { all: unset; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; font: 600 14px/1 var(--font-text); flex: none; }
  #np button:hover { background: rgba(255,255,255,.16); }
  #np button.pp { background: #eaf1ff; color: #0c1a33; }
  #toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(13,27,51,.94); color: #eaf1ff; font: var(--type-body); display: none; z-index: 9; }
</style>
</head>
<body>
<div id="stage">
  <div id="x">&#x2715;</div>
  <div id="head" class="head" role="button" aria-label="Aura: your phone's recent apps"><img src="app-mark.svg" alt=""></div>
  <div id="np" role="group" aria-label="Now playing"><div class="art" id="npArt"></div><div class="txt"><div class="t" id="npT"></div><div class="a" id="npA"></div></div>
    <button id="npPrev" aria-label="Previous">&#x23EE;</button><button id="npPP" class="pp" aria-label="Play or pause">&#x23EF;</button><button id="npNext" aria-label="Next">&#x23ED;</button></div>
  <div id="toast" role="status"></div>
</div>
<script src="vendor/motion.js"></script>
<script src="head.js"></script>
</body>
</html>
